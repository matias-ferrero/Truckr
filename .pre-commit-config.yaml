repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: typstyle
        name: typstyle
        entry: typstyle -i
        language: system
        types: [file]
        files: \.typ$
      - id: stylelint
        name: stylelint (design-system enforcement)
        entry: bash -c 'cd frontend && deno task lint:css'
        language: system
        files: ^frontend/src/.*\.css$
        pass_filenames: false
