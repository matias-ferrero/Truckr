[project]
name = "fiuba-gestion-tp"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.2",
    "pandas>=3.0.1",
    "openpyxl>=3.1.5",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "ruff>=0.7",
]

[project.scripts]
team-performance = "team_performance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docs/scripts/team_performance"]

[tool.hatch.build.targets.wheel.sources]
"docs/scripts/team_performance" = "team_performance"

[tool.pytest.ini_options]
testpaths = ["docs/scripts/team_performance/tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["docs/scripts"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["docs/scripts/team_performance"]
mypy_path = "docs/scripts"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "team_performance.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["docs/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"docs/scripts/team_performance/tests/**" = ["B011"]
