---
openapi: 3.0.3
info:
  title: Truckr API
  version: v1
  description: Internal HTTP API for the Truckr® marketplace.
paths:
  "/api/auth/register":
    post:
      summary: Registers a new user with the chosen role
      tags:
      - Auth
      parameters: []
      responses:
        '201':
          description: created (shipper)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        '422':
          description: duplicate email
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
                role:
                  type: string
                  enum:
                  - carrier
                  - shipper
              required:
              - email
              - password
              - name
              - role
  "/api/auth/me":
    get:
      summary: Returns the current user with carrier/shipper rows
      tags:
      - Auth
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        '401':
          description: anonymous
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    patch:
      summary: Updates the current user's personal data (US3)
      tags:
      - Auth
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ok — returns updated user (email change also resets verified_at)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        '422':
          description: validation error — duplicate email or invalid format
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: anonymous
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
  "/api/cargo_offers":
    get:
      summary: list cargo offers for the authenticated shipper or carrier
      tags:
      - Cargo Offers
      security:
      - bearer_auth: []
      responses:
        '200':
          description: carrier sees only offers directed at them
        '401':
          description: unauthenticated
    post:
      summary: bid an existing cargo against a transport window (US7 — Shipper creates
        offer)
      tags:
      - Cargo Offers
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: cargo without volume accepts any vehicle
        '401':
          description: unauthenticated
        '403':
          description: shipper cannot bid on another shipper's cargo
        '404':
          description: transport window not found or inactive
        '422':
          description: transport window already has a pending offer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cargo_offer:
                  type: object
                  required:
                  - cargo_id
                  - transport_window_id
                  - estimated_km
                  properties:
                    cargo_id:
                      type: integer
                    transport_window_id:
                      type: integer
                    estimated_km:
                      type: string
              required:
              - cargo_offer
  "/api/cargos":
    get:
      summary: list the shipper's cargos
      tags:
      - Cargos
      security:
      - bearer_auth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: filters by status
        '401':
          description: unauthenticated
        '403':
          description: non-shipper is forbidden
    post:
      summary: publish a cargo
      tags:
      - Cargos
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: created — status open, body includes matches
        '422':
          description: missing cargo params
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cargo:
                  type: object
              required:
              - cargo
  "/api/cargos/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: show a cargo with its nested offers
      tags:
      - Cargos
      security:
      - bearer_auth: []
      responses:
        '200':
          description: returns the cargo with nested offers
        '403':
          description: another shipper's cargo is forbidden
        '404':
          description: unknown cargo
    patch:
      summary: update a cargo
      tags:
      - Cargos
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: updates an editable cargo
        '422':
          description: blocked when an accepted offer exists
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cargo:
                  type: object
              required:
              - cargo
    delete:
      summary: soft-cancel a cargo and expire its pending offers
      tags:
      - Cargos
      security:
      - bearer_auth: []
      responses:
        '204':
          description: soft-cancels the cargo and expires pending sibling offers
        '422':
          description: blocked when an accepted offer exists
  "/api/cargos/{id}/matches":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: list zone-compatible transport windows for a cargo
      tags:
      - Cargos
      security:
      - bearer_auth: []
      responses:
        '200':
          description: returns matching windows; excludes inactive, contended and
            incompatible ones
        '403':
          description: another shipper's cargo is forbidden
  "/api/carriers/me/transport_windows":
    get:
      summary: list my transport windows
      tags:
      - Transport Windows
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ok — paginated array of TransportWindow
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TransportWindow"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    post:
      summary: create a transport window
      tags:
      - Transport Windows
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransportWindow"
        '422':
          description: validation error — e.g. available_to before available_from
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - transport_window
              properties:
                transport_window:
                  type: object
                  required:
                  - vehicle_id
                  - origin_province
                  - price_per_km
                  - max_km
                  - available_from
                  - available_to
                  properties:
                    vehicle_id:
                      type: integer
                    origin_province:
                      type: string
                    origin_locality:
                      type: string
                      nullable: true
                    destination_province:
                      type: string
                      nullable: true
                    destination_locality:
                      type: string
                      nullable: true
                    price_per_km:
                      type: number
                    max_km:
                      type: integer
                    available_from:
                      type: string
                      format: date-time
                    available_to:
                      type: string
                      format: date-time
  "/api/carriers/me/transport_windows/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: fetch a single transport window
      tags:
      - Transport Windows
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransportWindow"
        '404':
          description: not found — window belongs to another carrier
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    patch:
      summary: update a transport window
      tags:
      - Transport Windows
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ok — returns updated window
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransportWindow"
        '422':
          description: validation error — e.g. reactivating an overlapping window
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: not found — window belongs to another carrier
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transport_window:
                  type: object
                  properties:
                    origin_province:
                      type: string
                    origin_locality:
                      type: string
                      nullable: true
                    destination_province:
                      type: string
                      nullable: true
                    destination_locality:
                      type: string
                      nullable: true
                    price_per_km:
                      type: number
                    max_km:
                      type: integer
                    available_from:
                      type: string
                      format: date-time
                    available_to:
                      type: string
                      format: date-time
                    active:
                      type: boolean
    delete:
      summary: delete a transport window
      tags:
      - Transport Windows
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: no content
        '404':
          description: not found — window belongs to another carrier
        '401':
          description: missing or invalid token
  "/api/carriers/{carrier_id}/vehicles":
    parameters:
    - name: carrier_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: list a carrier's fleet (public)
      tags:
      - Vehicles
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: successful
        '404':
          description: carrier not found
  "/api/carriers/{carrier_id}/vehicles/{id}":
    parameters:
    - name: carrier_id
      in: path
      required: true
      schema:
        type: integer
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: show a vehicle (public)
      tags:
      - Vehicles
      responses:
        '200':
          description: successful
  "/api/carriers/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: show a carrier's public profile (US6)
      tags:
      - Carriers
      responses:
        '200':
          description: without vehicles or windows still serialises
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CarrierDetail"
        '404':
          description: carrier not found
  "/api/auth/login":
    post:
      summary: Authenticates with email + password and returns a JWT
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: ok (returns Bearer token in Authorization header)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        '401':
          description: email not found (no user enumeration)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                  required:
                  - email
                  - password
              required:
              - user
  "/api/auth/logout":
    delete:
      summary: Revokes the JWT (rotates the user's JTI)
      tags:
      - Auth
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '204':
          description: no content (JWT revoked)
        '401':
          description: missing Authorization header
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/transport_windows":
    parameters:
    - name: origin_province
      in: query
      required: true
      schema:
        type: string
    - name: destination_province
      in: query
      required: true
      schema:
        type: string
    - name: date_from
      in: query
      required: true
      schema:
        type: string
    - name: date_to
      in: query
      required: true
      schema:
        type: string
    get:
      summary: search carriers by province and date range
      tags:
      - Transport Windows
      responses:
        '200':
          description: includes open-destination windows when filtering by destination
        '422':
          description: invalid date format
servers:
- url: http://localhost:3000
  description: Local dev
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
      required:
      - error
    Me:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        full_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum:
            - carrier
            - shipper
        carrier:
          type: object
          nullable: true
        shipper:
          type: object
          nullable: true
      required:
      - id
      - email
      - roles
    Photo:
      type: object
      properties:
        id:
          type: integer
        thumbnail:
          type: string
        card:
          type: string
        full:
          type: string
    Vehicle:
      type: object
      properties:
        id:
          type: integer
        make:
          type: string
        model:
          type: string
        year:
          type: integer
          nullable: true
        plate:
          type: string
        vehicle_type:
          type: string
        max_load_kg:
          type: string
        length_cm:
          type: integer
          nullable: true
        width_cm:
          type: integer
          nullable: true
        height_cm:
          type: integer
          nullable: true
        volume_cm3:
          type: integer
          nullable: true
        gps_enabled:
          type: boolean
        description:
          type: string
          nullable: true
        photos:
          type: array
          items:
            "$ref": "#/components/schemas/Photo"
    VehicleSlim:
      type: object
      properties:
        id:
          type: integer
        make:
          type: string
        model:
          type: string
        year:
          type: integer
          nullable: true
        plate:
          type: string
        vehicle_type:
          type: string
        max_load_kg:
          type: string
        gps_enabled:
          type: boolean
        photos:
          type: array
          items:
            "$ref": "#/components/schemas/Photo"
    VehicleListResponse:
      type: array
      items:
        "$ref": "#/components/schemas/VehicleSlim"
    TransportWindowVehicle:
      type: object
      properties:
        id:
          type: integer
        make:
          type: string
        model:
          type: string
        plate:
          type: string
        vehicle_type:
          type: string
    TransportWindow:
      type: object
      properties:
        id:
          type: integer
        vehicle_id:
          type: integer
        origin_province:
          type: string
        origin_locality:
          type: string
          nullable: true
        destination_province:
          type: string
          nullable: true
        destination_locality:
          type: string
          nullable: true
        price_per_km:
          type: string
        max_km:
          type: integer
        available_from:
          type: string
          format: date-time
        available_to:
          type: string
          format: date-time
        active:
          type: boolean
        vehicle:
          "$ref": "#/components/schemas/TransportWindowVehicle"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TransportWindowListResponse:
      type: array
      items:
        "$ref": "#/components/schemas/TransportWindow"
    CargoOffer:
      type: object
      properties:
        id:
          type: integer
        cargo_id:
          type: integer
        carrier_id:
          type: integer
        transport_window_id:
          type: integer
        amount_cents:
          type: integer
        currency:
          type: string
          enum:
          - ARS
        status:
          type: string
          enum:
          - pending
          - accepted
          - paid
          - expired
          - cancelled
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - cargo_id
      - carrier_id
      - transport_window_id
      - amount_cents
      - currency
      - status
      - expires_at
    CarrierDetail:
      type: object
      properties:
        id:
          type: integer
        legal_name:
          type: string
          nullable: true
        tax_id:
          type: string
          nullable: true
        base_city:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        rating_avg:
          type: string
        reviews_count:
          type: integer
        completed_shipments:
          type: integer
        vehicles:
          type: array
          items:
            "$ref": "#/components/schemas/Vehicle"
        transport_windows:
          type: array
          items:
            "$ref": "#/components/schemas/TransportWindow"
      required:
      - id
      - rating_avg
      - reviews_count
      - vehicles
      - transport_windows
