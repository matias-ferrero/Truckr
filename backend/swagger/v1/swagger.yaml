---
openapi: 3.0.3
info:
  title: Truckr API
  version: v1
  description: Internal HTTP API for the Truckr® marketplace.
paths:
  "/api/auth/csrf":
    get:
      summary: Returns the CSRF token and bootstraps a session cookie
      tags:
      - Auth
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token:
                    type: string
                required:
                - csrf_token
  "/api/auth/register":
    post:
      summary: Registers a new user with the chosen role
      tags:
      - Auth
      parameters: []
      responses:
        '201':
          description: created (shipper)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        '422':
          description: duplicate email
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
                role:
                  type: string
                  enum:
                  - carrier
                  - shipper
              required:
              - email
              - password
              - name
              - role
  "/api/auth/login":
    post:
      summary: Logs in with email + password
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
  "/api/auth/logout":
    delete:
      summary: Signs the current user out
      tags:
      - Auth
      responses:
        '204':
          description: no content
  "/api/auth/me":
    get:
      summary: Returns the current user with carrier/shipper rows
      tags:
      - Auth
      responses:
        '200':
          description: authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        '401':
          description: anonymous
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/carriers/{carrier_id}/vehicles":
    parameters:
    - name: carrier_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: list a carrier's fleet (public)
      tags:
      - Vehicles
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: successful
        '404':
          description: carrier not found
  "/api/carriers/{carrier_id}/vehicles/{id}":
    parameters:
    - name: carrier_id
      in: path
      required: true
      schema:
        type: integer
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: show a vehicle (public)
      tags:
      - Vehicles
      responses:
        '200':
          description: successful
servers:
- url: http://localhost:3000
  description: Local dev
components:
  securitySchemes:
    cookie_auth:
      type: apiKey
      in: cookie
      name: _truckr_session
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
      required:
      - error
    Me:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        full_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum:
            - carrier
            - shipper
        carrier:
          type: object
          nullable: true
        shipper:
          type: object
          nullable: true
      required:
      - id
      - email
      - roles
    Photo:
      type: object
      properties:
        id:
          type: integer
        thumbnail:
          type: string
        card:
          type: string
        full:
          type: string
    Vehicle:
      type: object
      properties:
        id:
          type: integer
        make:
          type: string
        model:
          type: string
        year:
          type: integer
          nullable: true
        plate:
          type: string
        vehicle_type:
          type: string
        max_load_kg:
          type: string
        length_cm:
          type: integer
          nullable: true
        width_cm:
          type: integer
          nullable: true
        height_cm:
          type: integer
          nullable: true
        volume_cm3:
          type: integer
          nullable: true
        gps_enabled:
          type: boolean
        description:
          type: string
          nullable: true
        photos:
          type: array
          items:
            "$ref": "#/components/schemas/Photo"
    VehicleSlim:
      type: object
      properties:
        id:
          type: integer
        make:
          type: string
        model:
          type: string
        year:
          type: integer
          nullable: true
        plate:
          type: string
        vehicle_type:
          type: string
        max_load_kg:
          type: string
        gps_enabled:
          type: boolean
        photos:
          type: array
          items:
            "$ref": "#/components/schemas/Photo"
    VehicleListResponse:
      type: array
      items:
        "$ref": "#/components/schemas/VehicleSlim"
