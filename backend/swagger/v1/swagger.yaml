---
openapi: 3.0.3
info:
  title: Truckr API
  version: v1
  description: Internal HTTP API for the Truckr® marketplace.
paths:
  "/api/auth/register":
    post:
      summary: Registers a new user with the chosen role
      tags:
      - Auth
      parameters: []
      responses:
        '201':
          description: created (shipper)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        '422':
          description: duplicate email
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
                role:
                  type: string
                  enum:
                  - carrier
                  - shipper
              required:
              - email
              - password
              - name
              - role
  "/api/auth/me":
    get:
      summary: Returns the current user with carrier/shipper rows
      tags:
      - Auth
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        '401':
          description: anonymous
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/carriers/{carrier_id}/vehicles":
    parameters:
    - name: carrier_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: list a carrier's fleet (public)
      tags:
      - Vehicles
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: successful
        '404':
          description: carrier not found
  "/api/carriers/{carrier_id}/vehicles/{id}":
    parameters:
    - name: carrier_id
      in: path
      required: true
      schema:
        type: integer
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: show a vehicle (public)
      tags:
      - Vehicles
      responses:
        '200':
          description: successful
  "/api/carriers/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: show a carrier's public profile (US6)
      tags:
      - Carriers
      responses:
        '200':
          description: without vehicles or windows still serialises
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CarrierDetail"
        '404':
          description: carrier not found
  "/api/auth/login":
    post:
      summary: Authenticates with email + password and returns a JWT
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: ok (returns Bearer token in Authorization header)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        '401':
          description: email not found (no user enumeration)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                  required:
                  - email
                  - password
              required:
              - user
  "/api/auth/logout":
    delete:
      summary: Revokes the JWT (rotates the user's JTI)
      tags:
      - Auth
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '204':
          description: no content (JWT revoked)
        '401':
          description: missing Authorization header
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/transport_windows":
    parameters:
    - name: origin_zone
      in: query
      required: true
      schema:
        type: string
    - name: destination_zone
      in: query
      required: true
      schema:
        type: string
    - name: date_from
      in: query
      required: true
      schema:
        type: string
    - name: date_to
      in: query
      required: true
      schema:
        type: string
    get:
      summary: search carriers by zones and date range
      tags:
      - Transport Windows
      responses:
        '200':
          description: successful
        '422':
          description: invalid date format
servers:
- url: http://localhost:3000
  description: Local dev
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
      required:
      - error
    Me:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        full_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum:
            - carrier
            - shipper
        carrier:
          type: object
          nullable: true
        shipper:
          type: object
          nullable: true
      required:
      - id
      - email
      - roles
    Photo:
      type: object
      properties:
        id:
          type: integer
        thumbnail:
          type: string
        card:
          type: string
        full:
          type: string
    Vehicle:
      type: object
      properties:
        id:
          type: integer
        make:
          type: string
        model:
          type: string
        year:
          type: integer
          nullable: true
        plate:
          type: string
        vehicle_type:
          type: string
        max_load_kg:
          type: string
        length_cm:
          type: integer
          nullable: true
        width_cm:
          type: integer
          nullable: true
        height_cm:
          type: integer
          nullable: true
        volume_cm3:
          type: integer
          nullable: true
        gps_enabled:
          type: boolean
        description:
          type: string
          nullable: true
        photos:
          type: array
          items:
            "$ref": "#/components/schemas/Photo"
    VehicleSlim:
      type: object
      properties:
        id:
          type: integer
        make:
          type: string
        model:
          type: string
        year:
          type: integer
          nullable: true
        plate:
          type: string
        vehicle_type:
          type: string
        max_load_kg:
          type: string
        gps_enabled:
          type: boolean
        photos:
          type: array
          items:
            "$ref": "#/components/schemas/Photo"
    VehicleListResponse:
      type: array
      items:
        "$ref": "#/components/schemas/VehicleSlim"
    TransportWindow:
      type: object
      properties:
        id:
          type: integer
        vehicle_id:
          type: integer
        origin_zone:
          type: string
        destination_zone:
          type: string
        price_per_km:
          type: string
        max_km:
          type: integer
        available_from:
          type: string
          format: date-time
        available_to:
          type: string
          format: date-time
        active:
          type: boolean
    CarrierDetail:
      type: object
      properties:
        id:
          type: integer
        legal_name:
          type: string
          nullable: true
        tax_id:
          type: string
          nullable: true
        base_city:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        rating_avg:
          type: string
        reviews_count:
          type: integer
        completed_shipments:
          type: integer
        vehicles:
          type: array
          items:
            "$ref": "#/components/schemas/Vehicle"
        transport_windows:
          type: array
          items:
            "$ref": "#/components/schemas/TransportWindow"
      required:
      - id
      - rating_avg
      - reviews_count
      - vehicles
      - transport_windows
