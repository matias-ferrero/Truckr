service: truckr
image: truckr-backend

# Filled in from `terraform output` (envs/staging):
#   app_host       → proxy.host + servers.web[0]
#   ecr_repo_url   → registry.server
# Both are stable across redeploys: app_host is built from the EIP and the EIP
# survives stop/start; ecr_repo_url is the ECR repository URL.
servers:
  web:
    - ip-18-228-83-21.sslip.io

proxy:
  ssl: true
  host: ip-18-228-83-21.sslip.io
  app_port: 80

registry:
  server: 000946353046.dkr.ecr.sa-east-1.amazonaws.com
  username: AWS
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - SEED_ADMIN_EMAIL
    - SEED_ADMIN_PASSWORD
  clear:
    RAILS_ENV: production
    SOLID_QUEUE_IN_PUMA: true

# SQLite + Active Storage persist on a named volume so container replacement
# doesn't lose data. Daily EBS snapshots are taken via DLM (see ec2 module).
volumes:
  - truckr_storage:/rails/storage

asset_path: /rails/public/assets

builder:
  arch: amd64

ssh:
  user: ubuntu

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
