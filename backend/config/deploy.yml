service: truckr
image: truckr-backend

# Infrastructure addresses are read from ENV with staging-stable fallbacks so
# a `kamal deploy` from the operator's laptop keeps working with no extra
# config. CI (backend-deploy.yml) resolves the real values from SSM and
# exports them before invoking kamal:
#   EC2_INSTANCE_ID    → servers.web[0]  (instance-id, not hostname — Kamal
#                                          SSHes via SSM proxy_command below)
#   APP_HOST           → proxy.host       (sslip.io hostname Kamal claims TLS for)
#   ECR_REGISTRY_URL   → registry.server  (account-scoped registry URL)
servers:
  web:
    - <%= ENV.fetch("EC2_INSTANCE_ID", "ip-18-228-83-21.sslip.io") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("APP_HOST", "ip-18-228-83-21.sslip.io") %>
  app_port: 80

registry:
  server: <%= ENV.fetch("ECR_REGISTRY_URL", "000946353046.dkr.ecr.sa-east-1.amazonaws.com") %>
  username: AWS
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - SEED_ADMIN_EMAIL
    - SEED_ADMIN_PASSWORD
    - GOOGLE_MAPS_API_KEY
  clear:
    RAILS_ENV: production
    SOLID_QUEUE_IN_PUMA: true
    # Public backend hostname Rails uses to build absolute URLs (Active Storage
    # links, mailer links) outside a request context, where it can't infer the
    # host from a request. CI already resolves this from SSM
    # (/truckr/${TRUCKR_ENV}/app_host) and exports it for proxy.host above; we
    # reuse the same value inside the container. Laptop deploys export APP_HOST.
    APP_HOST: <%= ENV["APP_HOST"] %>
    # Public SPA origin for ActiveAdmin's impersonation redirect. CI resolves
    # this from SSM (/truckr/${TRUCKR_ENV}/frontend_origin) before invoking
    # kamal; laptop deploys can override by exporting FRONTEND_ORIGIN.
    FRONTEND_ORIGIN: <%= ENV["FRONTEND_ORIGIN"] %>

# SQLite + Active Storage persist on a named volume so container replacement
# doesn't lose data. Daily EBS snapshots are taken via DLM (see ec2 module).
volumes:
  - truckr_storage:/rails/storage

asset_path: /rails/public/assets

builder:
  arch: amd64

ssh:
  user: ubuntu
  # CI tunnels SSH through SSM Session Manager so no inbound port-22 ingress
  # is needed for GitHub runners. %h is the instance-id from `servers.web`
  # above, %p is the SSH port. Empty (the laptop default) → direct SSH/TCP
  # via the SG ingress rule.
  proxy_command: <%= ENV.fetch("KAMAL_SSH_PROXY_COMMAND", "") %>

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
