name: Release Please

on:
    push:
        branches:
            - main

# Serialize: concurrent release-please runs would race on the Release PR.
# Don't cancel-in-progress — a half-finished release with PDFs uploaded but
# tag not pushed would be wedged.
concurrency:
    group: release-please-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            upload_url: ${{ steps.release.outputs.upload_url }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    build-and-upload:
        runs-on: ubuntu-latest
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created }}
        steps:
            - uses: actions/checkout@v5

            - uses: typst-community/setup-typst@v5.1.0

            - name: Build artifacts PDF
              run: typst compile --root docs docs/artifacts/main.typ artifacts.pdf

            - name: Build prompts PDF
              run: typst compile --root docs docs/prompts/main.typ prompts.pdf

            - name: Upload PDFs to release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.release-please.outputs.tag_name }}
                  files: |
                      artifacts.pdf
                      prompts.pdf
