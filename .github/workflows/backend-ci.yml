name: Backend CI

on:
    pull_request:
        paths:
            - "backend/**"
            - ".github/workflows/backend-ci.yml"
    push:
        branches: [main]
        paths:
            - "backend/**"
            - ".github/workflows/backend-ci.yml"

concurrency:
    group: backend-ci-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: backend

jobs:
    scan_ruby:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up Ruby
              uses: ruby/setup-ruby@v1
              with:
                  working-directory: backend
                  bundler-cache: true

            - name: Scan for common Rails security vulnerabilities using static analysis
              run: bin/brakeman --no-pager

            - name: Scan for known security vulnerabilities in gems used
              run: bin/bundler-audit

    scan_js:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up Ruby
              uses: ruby/setup-ruby@v1
              with:
                  working-directory: backend
                  bundler-cache: true

            - name: Scan for security vulnerabilities in JavaScript dependencies
              run: bin/importmap audit

    lint:
        runs-on: ubuntu-latest
        env:
            RUBOCOP_CACHE_ROOT: tmp/rubocop
        steps:
            - uses: actions/checkout@v5

            - name: Set up Ruby
              uses: ruby/setup-ruby@v1
              with:
                  working-directory: backend
                  bundler-cache: true

            - name: Prepare RuboCop cache
              uses: actions/cache@v4
              env:
                  DEPENDENCIES_HASH: ${{ hashFiles('backend/.ruby-version', 'backend/**/.rubocop.yml', 'backend/**/.rubocop_todo.yml', 'backend/Gemfile.lock') }}
              with:
                  path: backend/tmp/rubocop
                  key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
                  restore-keys: |
                      rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

            - name: Lint code for consistent style
              run: bin/rubocop -f github

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up Ruby
              uses: ruby/setup-ruby@v1
              with:
                  working-directory: backend
                  bundler-cache: true

            - name: Build ActiveAdmin stylesheet (dartsass)
              run: bin/rails dartsass:build

            - name: Prepare test database
              env:
                  RAILS_ENV: test
              run: bin/rails db:test:prepare

            - name: Run RSpec
              run: bundle exec rspec

            - name: Regenerate OpenAPI spec
              run: bundle exec rake rswag:specs:swaggerize

            - name: Verify swagger.yaml is up to date
              run: git diff --exit-code swagger
