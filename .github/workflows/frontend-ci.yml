name: Frontend CI

on:
    pull_request:
        paths:
            - "frontend/**"
            - ".github/workflows/frontend-ci.yml"
            - "mise.toml"
    push:
        branches: [main]
        paths:
            - "frontend/**"
            - ".github/workflows/frontend-ci.yml"
            - "mise.toml"

concurrency:
    group: frontend-ci-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: frontend

jobs:
    unit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: jdx/mise-action@v4
              with:
                  experimental: true

            - name: Cache Deno
              uses: actions/cache@v5
              with:
                  path: ~/.cache/deno
                  key: deno-${{ runner.os }}-${{ hashFiles('frontend/deno.lock') }}
                  restore-keys: |
                      deno-${{ runner.os }}-

            - name: Cache node_modules
              uses: actions/cache@v5
              with:
                  path: frontend/node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('frontend/deno.lock') }}
                  restore-keys: |
                      node-modules-${{ runner.os }}-

            - name: Run Vitest with coverage
              run: deno task test:coverage

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: frontend-coverage
                  path: frontend/coverage
                  retention-days: 7

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: jdx/mise-action@v4
              with:
                  experimental: true

            - name: Cache Deno
              uses: actions/cache@v5
              with:
                  path: ~/.cache/deno
                  key: deno-${{ runner.os }}-${{ hashFiles('frontend/deno.lock') }}
                  restore-keys: |
                      deno-${{ runner.os }}-

            - name: Cache node_modules
              uses: actions/cache@v5
              with:
                  path: frontend/node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('frontend/deno.lock') }}
                  restore-keys: |
                      node-modules-${{ runner.os }}-

            - name: Build
              run: deno task build

            - name: Upload bundle
              uses: actions/upload-artifact@v7
              with:
                  name: frontend-dist
                  path: frontend/dist
                  retention-days: 7

    e2e:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v6

            - uses: jdx/mise-action@v4
              with:
                  experimental: true

            - name: Cache Deno
              uses: actions/cache@v5
              with:
                  path: ~/.cache/deno
                  key: deno-${{ runner.os }}-${{ hashFiles('frontend/deno.lock') }}
                  restore-keys: |
                      deno-${{ runner.os }}-

            - name: Cache node_modules
              uses: actions/cache@v5
              with:
                  path: frontend/node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('frontend/deno.lock') }}
                  restore-keys: |
                      node-modules-${{ runner.os }}-

            - name: Cache Playwright browsers
              uses: actions/cache@v5
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('frontend/deno.json', 'frontend/deno.lock') }}
                  restore-keys: |
                      playwright-${{ runner.os }}-

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: deno task test:e2e:install

            - name: Install Playwright system deps
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: deno run -A npm:playwright install-deps chromium

            # Backend boots inside Playwright's webServer so e2e can exercise the API.
            - name: Set up Ruby (backend)
              uses: ruby/setup-ruby@v1
              with:
                  working-directory: backend
                  bundler-cache: true

            - name: Run Playwright (chromium)
              run: deno task test:e2e

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: frontend/playwright-report
                  retention-days: 7
