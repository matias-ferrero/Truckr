name: Frontend deploy

on:
  # Same trigger model as backend-deploy.yml:
  #   - push to main (paths frontend/**)        →  deploys staging
  #   - release published (release-please tag)  →  deploys production
  #   - workflow_dispatch                       →  deploys env from input
  #
  # `release: published` instead of `push: tags: ['v*']` because a release-
  # please tag commit only modifies CHANGELOG.md + version manifests, never
  # frontend/** — a paths-filtered tag-push trigger would never fire.
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  id-token: write
  contents: read
  # Needed by the "Wait for in-progress infra-apply" step below to list runs
  # of the infra-apply workflow via the GitHub API.
  actions: read

jobs:
  deploy:
    name: deploy-${{ github.event.inputs.env || (github.event_name == 'release' && 'production') || 'staging' }}
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-deploy-${{ github.event.inputs.env || (github.event_name == 'release' && 'production') || 'staging' }}
      # Don't cancel — `aws s3 sync` mid-flight could leave the bucket in a
      # half-updated state where some hashed assets are old.
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: sa-east-1
      TRUCKR_ENV: ${{ github.event.inputs.env || (github.event_name == 'release' && 'production') || 'staging' }}

    steps:
      - name: Wait for in-progress infra-apply
        # Block deploys while an infra-apply run is in-flight or queued. A PR
        # that adds a new SSM param + bumps the app can otherwise race the
        # apply that mints the param, and the SSM resolve step below would
        # fail with ParameterNotFound. Bidirectional via concurrency would
        # over-serialize unrelated deploys, so we gate one-way: deploys wait
        # on apply, not the reverse.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Same-event race: a push to main touching infra/** and frontend/**
          # triggers both workflows in parallel; the deploy worker often boots
          # faster than infra-apply gets a runner. A brief head-start lets
          # infra-apply register before our first poll. Skipped on
          # workflow_dispatch — manual triggers don't share an event.
          if [ "${{ github.event_name }}" = "push" ]; then
            sleep 5
          fi
          for i in {1..60}; do
            busy=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow=infra-apply.yml \
              --status=in_progress \
              --json databaseId --jq 'length')
            queued=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow=infra-apply.yml \
              --status=queued \
              --json databaseId --jq 'length')
            total=$((busy + queued))
            if [ "$total" -eq 0 ]; then
              echo "No in-progress or queued infra-apply runs — proceeding."
              exit 0
            fi
            echo "Attempt $i/60: ${busy} in-progress + ${queued} queued infra-apply run(s); sleeping 30s..."
            sleep 30
          done
          echo "::error::infra-apply still running after 30 minutes — aborting deploy"
          exit 1

      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Configure AWS credentials (OIDC)
        # Up-front so SSM resolution can run before the build — Vite inlines
        # VITE_API_BASE_URL at build time, so it must be in env when
        # `deno task build` runs, not at sync time.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve infra from SSM
        # Terraform owns the URL shape (see infra/envs/*/main.tf
        # aws_ssm_parameter.api_base_url) — this step just reads it. Symmetric
        # with /truckr/<env>/frontend_origin on the backend side so a custom
        # domain rollout is a terraform-only change.
        run: |
          set -euo pipefail
          VITE_API_BASE_URL=$(aws ssm get-parameter --name "/truckr/${TRUCKR_ENV}/api_base_url" --query Parameter.Value --output text)
          FRONTEND_BUCKET=$(aws ssm get-parameter --name "/truckr/${TRUCKR_ENV}/frontend_bucket" --query Parameter.Value --output text)
          CFD_ID=$(aws ssm get-parameter --name "/truckr/${TRUCKR_ENV}/cloudfront_distribution_id" --query Parameter.Value --output text)
          {
            echo "VITE_API_BASE_URL=$VITE_API_BASE_URL"
            echo "FRONTEND_BUCKET=$FRONTEND_BUCKET"
            echo "CFD_ID=$CFD_ID"
          } >> "$GITHUB_ENV"

      - name: Build frontend (deno task build → vite)
        working-directory: frontend
        run: deno task build

      - name: Sync hashed assets (long-cache, immutable)
        # Vite emits hashed filenames for everything under dist/assets/, so
        # browsers can cache them forever. --delete prunes stale hashes.
        # index.html is excluded here and handled separately below — it's
        # the only file that needs to be fresh on every deploy.
        run: |
          aws s3 sync frontend/dist/ "s3://${FRONTEND_BUCKET}/" \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude index.html

      - name: Upload index.html (no-cache)
        # index.html references the hashed assets by name. If it were cached
        # at the edge, users would hit stale references after a deploy.
        run: |
          aws s3 cp frontend/dist/index.html "s3://${FRONTEND_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront /index.html
        # Only /index.html needs invalidation — hashed assets are immutable.
        # AWS gives 1000 free invalidation paths/month; one per deploy is fine.
        run: |
          set -euo pipefail
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CFD_ID" \
            --paths "/index.html" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $INVALIDATION_ID queued; waiting for completion..."
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CFD_ID" \
            --id "$INVALIDATION_ID"
          echo "Invalidation completed."

      - name: Smoke test
        # Confirm CloudFront serves the new index.html. We can't assert
        # specific build content from CI without a build-time marker, so
        # this is just an availability check.
        run: |
          set -euo pipefail
          CF_DOMAIN=$(aws ssm get-parameter --name "/truckr/${TRUCKR_ENV}/cloudfront_distribution_id" --query Parameter.Value --output text >/dev/null && \
            aws cloudfront get-distribution --id "$CFD_ID" --query 'Distribution.DomainName' --output text)
          for i in {1..5}; do
            if curl --fail --silent --show-error --max-time 10 -o /dev/null "https://${CF_DOMAIN}/"; then
              echo "Smoke OK on attempt $i — https://${CF_DOMAIN}/"
              exit 0
            fi
            echo "Attempt $i: not ready, sleeping 15s..."
            sleep 15
          done
          echo "::error::Smoke check failed: https://${CF_DOMAIN}/ did not return 200"
          exit 1
