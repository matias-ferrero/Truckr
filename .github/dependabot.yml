version: 2
updates:
    - package-ecosystem: bundler
      directory: "/backend"
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      groups:
          backend-minor-and-patch:
              update-types:
                  - minor
                  - patch
    - package-ecosystem: npm
      directory: "/frontend"
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      groups:
          frontend-minor-and-patch:
              update-types:
                  - minor
                  - patch
    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      groups:
          actions-minor-and-patch:
              update-types:
                  - minor
                  - patch
